<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu_Busca_Livros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .search-box {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
        }

        input {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 30px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-info {
            flex: 1;
        }

        .result-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .result-meta {
            color: #666;
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 0.8em;
            margin-left: 5px;
        }

        .download-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #218838;
        }

        .status {
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 meu_Busca_Livros</h1>
        <p class="subtitle">Busque e baixe livros gratuitos de fontes públicas</p>

        <div class="search-box">
            <input type="text" id="title" placeholder="Título do livro" />
            <input type="text" id="author" placeholder="Autor (opcional)" />
            <button id="searchBtn" onclick="searchBooks()">🔍 Buscar</button>
        </div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        async function searchBooks() {
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();

            if (!title) {
                showStatus('Por favor, digite o título do livro', 'error');
                return;
            }

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Buscando...';

            document.getElementById('results').innerHTML = '<div class="loading"><div class="spinner"></div><p>Buscando livros...</p></div>';
            document.getElementById('status').innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });

                const data = await response.json();

                if (data.error) {
                    showStatus(data.error, 'error');
                    document.getElementById('results').innerHTML = '';
                    return;
                }

                displayResults(data);

            } catch (error) {
                showStatus('Erro ao buscar: ' + error.message, 'error');
                document.getElementById('results').innerHTML = '';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Buscar';
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');

            if (data.count === 0) {
                resultsDiv.innerHTML = '<div class="status info">Nenhum livro encontrado. Tente outro título.</div>';
                return;
            }

            showStatus(`${data.count} livro(s) encontrado(s)!`, 'success');

            let html = '';
            data.results.forEach((book, index) => {
                html += `
                    <div class="result-item">
                        <div class="result-info">
                            <div class="result-title">${book.title}</div>
                            <div class="result-meta">
                                <strong>Autor:</strong> ${book.author}
                                <span class="badge">${book.format}</span>
                                <span class="badge">${book.source}</span>
                            </div>
                        </div>
                        <button class="download-btn" onclick="downloadBook(${index}, '${data.search_id}')">
                            ⬇️ Baixar ${book.format}
                        </button>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        async function downloadBook(index, searchId) {
            try {
                showStatus('📥 Preparando download...', 'info');

                // Buscar dados do livro primeiro (sem prompt de caminho)
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        book_index: index,
                        search_id: searchId
                        // download_path removido - arquivo será baixado direto
                    })
                });

                const data = await response.json();

                if (data.error) {
                    showStatus('❌ ' + data.error, 'error');
                    return;
                }

                showStatus(`📥 Baixando: ${data.filename}...`, 'info');

                // Iniciar monitoramento do download
                monitorDownloadAndTrigger(data.download_id, data.filename);

            } catch (error) {
                showStatus('❌ Erro ao iniciar download: ' + error.message, 'error');
            }
        }

        async function monitorDownloadAndTrigger(downloadId, filename) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/download-status/${downloadId}`);
                    const data = response.ok ? await response.json() : null;

                    if (!data) {
                        showStatus('❌ Erro ao obter status do download', 'error');
                        clearInterval(interval);
                        return;
                    }

                    if (data.status === 'completo') {
                        clearInterval(interval);

                        // Trigger download pelo navegador usando a URL do arquivo
                        triggerBrowserDownload(data.pdf_url || `/api/download-pdf/${filename}`, filename);
                        showStatus(`✅ Download concluído! Arquivo salvo: ${filename}`, 'success');

                    } else if (data.status === 'erro') {
                        clearInterval(interval);
                        showStatus('❌ ' + data.message, 'error');
                    } else {
                        // Atualizar progresso
                        const progress = data.progress || 0;
                        showStatus(`📥 ${data.message} (${progress}%)`, 'info');
                    }
                } catch (error) {
                    clearInterval(interval);
                    showStatus('❌ Erro ao monitorar download', 'error');
                }
            }, 1000);
        }

        function triggerBrowserDownload(url, filename) {
            // Criar elemento de link invisível para download
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;  // Força download com nome específico
            link.style.display = 'none';

            // Adicionar ao DOM, clicar e remover
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Alternativa: usar fetch para melhor controle (comentado)
            // fetch(url)
            //     .then(res => res.blob())
            //     .then(blob => {
            //         const url = window.URL.createObjectURL(blob);
            //         const a = document.createElement('a');
            //         a.href = url;
            //         a.download = filename;
            //         document.body.appendChild(a);
            //         a.click();
            //         window.URL.revokeObjectURL(url);
            //         document.body.removeChild(a);
            //     });
        }

        function showStatus(message, type) {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        // Enter para buscar
        document.getElementById('title').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBooks();
        });
        document.getElementById('author').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBooks();
        });
    </script>
</body>

</html>
